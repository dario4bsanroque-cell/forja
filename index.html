<style>
/* Layout: app de una columna para el móvil en el gimnasio, barra de pestañas fija abajo; colores de discos olímpicos como semántica (rojo 25, amarillo 15, verde 10, azul 20). */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface2:#f5f6f8; --line:#d9dde3; --fg:#14171c; --muted:#5d6672;
  --accent:#1d4fd8; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --red:#d0312d; --yellow:#e0a100; --green:#1e9e57; --blue:#1d4fd8;
  --skin:#cfd4db; --skin-line:#b9c0c9; --chalk:#14171c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1e24; --surface2:#21262d; --line:#2e353e; --fg:#eef1f4; --muted:#9aa4b0;
  --accent:#5b8cff; --accent-ink:#0b1020; --accent-soft:#1f2b48;
  --red:#ff5a52; --yellow:#f2be2e; --green:#3cc77a; --blue:#5b8cff;
  --skin:#353c46; --skin-line:#454e5a; --chalk:#eef1f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e24; --surface2:#21262d; --line:#2e353e; --fg:#eef1f4; --muted:#9aa4b0;
  --accent:#5b8cff; --accent-ink:#0b1020; --accent-soft:#1f2b48;
  --red:#ff5a52; --yellow:#f2be2e; --green:#3cc77a; --blue:#5b8cff;
  --skin:#353c46; --skin-line:#454e5a; --chalk:#eef1f4; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:700;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--surface2)}
.hero{background:var(--chalk);color:var(--bg);border:0}
.hero .muted{color:color-mix(in oklab,var(--bg) 70%,var(--chalk))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in oklab,var(--red) 45%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.88rem}
.btn.big{min-height:52px;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:1.15rem;font-weight:700;width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.m:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600;background:var(--surface);cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.pill.g{background:color-mix(in oklab,var(--green) 18%,transparent);color:var(--green)}
.pill.y{background:color-mix(in oklab,var(--yellow) 22%,transparent);color:color-mix(in oklab,var(--yellow) 70%,var(--fg))}
.pill.r{background:color-mix(in oklab,var(--red) 16%,transparent);color:var(--red)}
.pill.b{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date],select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600;min-width:0}
.bar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
/* barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs.con-apps .in{grid-template-columns:repeat(7,1fr)}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.tab{text-decoration:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--red);position:absolute;margin-left:18px}
/* mapa muscular */
.body-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.body-pair figure{margin:0;text-align:center}
.body-pair figcaption{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--muted);font-weight:700}
svg.body{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
svg.body .sil{fill:var(--skin)}
svg.body .m{stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:filter .15s}
svg.body .m:hover{filter:brightness(1.12)}
svg.body .m.sel{stroke:var(--fg);stroke-width:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,9rem) 1fr 3.4rem;gap:10px;align-items:center;font-size:.9rem;cursor:pointer;border:0;background:transparent;padding:2px 0;text-align:left}
.mrow .bar>i{transition:width .3s}
/* entreno */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{padding:14px 16px 10px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.ex-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.sets{width:100%;border-collapse:collapse;font-size:.92rem}
.sets td,.sets th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.sets th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.sug{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:.88rem}
.done-mark{color:var(--green);font-weight:700}
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.timer .in{max-width:760px;margin:0 auto;background:var(--chalk);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:2rem;font-weight:800;min-width:4.2rem;font-variant-numeric:tabular-nums}
.timer .lab{flex:1;min-width:0;font-size:.85rem;line-height:1.2}
.timer .lab .bar{margin-top:6px;background:color-mix(in oklab,var(--bg) 20%,var(--chalk));border:0;height:6px}
.timer .lab .bar>i{background:var(--yellow)}
.timer button{background:transparent;color:var(--bg);border:1px solid color-mix(in oklab,var(--bg) 40%,var(--chalk));border-radius:8px;min-height:36px;padding:4px 9px;font-weight:700;cursor:pointer}
.timer.over .in{background:var(--green);color:#fff}
.timer.over button{color:#fff;border-color:rgba(255,255,255,.5)}
/* gráficos */
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:300px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
/* logros */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.badge .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1rem;color:#fff}
.badge.lock{opacity:.55}
.badge.lock .ico{background:var(--skin)!important;color:var(--muted)}
.badge b{font-size:.92rem;line-height:1.2}
.badge small{color:var(--muted);font-size:.78rem;line-height:1.3}
.lvl-plate{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;font-weight:800;color:#fff;flex:none;box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),inset 0 0 0 26px rgba(0,0,0,.08)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-size:.78rem;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.ladder span.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.tpl:hover{border-color:var(--muted)}
.picker{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.picker button{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer;text-align:left}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;gap:1px;background:var(--surface);min-width:0}
.wd b{font-family:var(--display);font-size:1.05rem}
.wd span{font-size:.62rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd i{font-style:normal;color:var(--green);font-weight:800;height:1em;line-height:1}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.ok{background:color-mix(in oklab,var(--green) 16%,var(--surface))}
.wd.miss{background:color-mix(in oklab,var(--red) 12%,var(--surface))}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fotos{display:flex;gap:6px}
.foto{margin:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.foto img{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--surface2)}
.foto .vacia{aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.78rem}
.foto figcaption{font-size:.72rem;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pod{border-radius:10px;padding:10px 6px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:flex-end}
.pod b{font-family:var(--display);font-size:1.5rem;line-height:1}
.pod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.pos1{background:var(--red);min-height:150px}.pod.pos2{background:var(--blue);min-height:120px}.pod.pos3{background:var(--yellow);color:#14171c;min-height:100px}
.pod.me{box-shadow:0 0 0 3px var(--fg)}
.rkrow{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rkrow:last-child{border-bottom:0}
.rkrow.me{background:var(--accent-soft);border-radius:8px;padding-inline:8px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-top:4px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer;color:var(--fg)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.f .row{margin-top:4px}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.li select{width:auto;max-width:46%;min-height:36px;font-size:.82rem}
@media (max-width:420px){h1{font-size:1.7rem}.kpi b{font-size:1.4rem}.mrow{grid-template-columns:minmax(0,7rem) 1fr 3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

 ['banca','Press banca con barra',['pecho'],['hombro-frontal','triceps'],6,8,180,2.5,'Escápulas juntas y pies firmes. Baja controlado al pecho.'],

 ['militar','Press militar con barra',['hombro-frontal','triceps'],['hombro-lateral','trapecio'],6,8,150,2.5,'Glúteos y abdomen apretados, cabeza pasa por delante.'],
 ['press-hombro-manc','Press de hombro con mancuernas',['hombro-frontal','hombro-lateral'],['triceps'],8,10,120,2,'Sentado, baja hasta la altura de las orejas.'],
 ['laterales','Elevaciones laterales con mancuernas',['hombro-lateral'],['trapecio'],12,20,60,1,'Sube hasta los hombros, sin balanceo. Peso ligero, mucha calidad.'],

function nivelDe(p){return p.experiencia==='<6m'?'principiante':p.experiencia==='>2a'?'avanzado':'intermedio'}
function disponible(id){const e=EXM[id];return !!e&&e.eq.every(q=>GYM.eq[q]!==false)}
function evitar(id,p){return (p.lesiones||[]).some(l=>(LES[l]||[]).includes(id))}
function isPrio(m){return (S.perfil.prioridades||[]).includes(m)}
function P(tid,perfil){
  const p=perfil||S.perfil, D=DIA[tid]; if(!D) return null;
  const niv=nivelDe(p), nEj=+GYM.nEj||7, usados=new Set(), ej=[], prioHecha=new Set();
  D.slots.forEach((slot,i)=>{
    if(ej.length>=nEj) return;
    let sl=slot; if(niv==='principiante'&&slot[0]==='dominadas') sl=['jalon','jalon-polea','dominadas'];
    const libres=sl.filter(id=>disponible(id)&&!usados.has(id)); if(!libres.length) return;
    const sanos=libres.filter(id=>!evitar(id,p)), ops=sanos.length?sanos:libres;
    const cg=(GYM.cambios&&GYM.cambios[tid]||{})[i];
    const el=(cg&&ops.includes(cg))?cg:ops[0];
    usados.add(el); const e=EXM[el];
    let series=e.c?(niv!=='principiante'&&ej.length===0?4:3):(niv==='principiante'?2:3);
    const pm=(p.prioridades||[]).filter(m=>e.p.includes(m)&&!prioHecha.has(m)); const prio=pm.length>0;
    if(prio){ series=Math.min(5,series+1); pm.forEach(m=>prioHecha.add(m)); }
    let rmin=e.rmin,rmax=e.rmax;
    if(e.c){ if(p.objetivo==='fuerza'){rmin=5;rmax=8} else {rmin=Math.max(6,e.rmin);rmax=Math.max(rmin+2,Math.min(12,e.rmax+2))} }
    ej.push({ej:el,series,rmin,rmax,slot:i,ops:libres,prio});
  });
  return {n:D.n,sub:D.dias,ej};
}

function dbWrite(path,data){
  const [c,id]=path.split('/'); const col=c==='gym'?'perfil':c;
  pend[col+'/'+id] = data==null ? null : JSON.parse(JSON.stringify(data)); savePend();

async function flush(){
  if(!CLOUD||!session||flushing) return; flushing=true; let again=false;
  try{
    for(const k of Object.keys(pend)){
      const data=pend[k]; const i=k.indexOf('/'); const col=k.slice(0,i), id=k.slice(i+1);
      const q = data==null
        ? sb.from('forja').delete().eq('col',col).eq('id',id)
        : sb.from('forja').upsert({user_id:session.user.id,col,id,data,updated_at:new Date().toISOString()},{onConflict:'user_id,col,id'});
      const {error}=await q; if(error) throw error;
      if(pend[k]===data){delete pend[k];savePend()} else again=true;
    }
    if(nPend()) again=true; else setSync('nube');
  }catch(e){ setSync('pend'); }
  finally{ flushing=false; if(again) setTimeout(flush,300); }
}
async function pull(){
  if(!CLOUD||!session||pulling) return; pulling=true;
  try{
    if(syncState!=='nube') setSync('cargando');
    let rows=[], from=0;
    while(true){
      const {data,error}=await sb.from('forja').select('col,id,data').order('col').order('id').range(from,from+999);
      if(error) throw error; rows=rows.concat(data); if(data.length<1000) break; from+=1000;
    }
    const yo=session.user.id;
    if(S.owner&&S.owner!==yo){ S=vacio(yo); pend={}; savePend(); lsSave(); }
    if(!rows.length){ // cuenta nueva: empieza de cero (nunca se suben datos de otra persona de este dispositivo)
      if(S.owner===yo){ dbWrite('gym/perfil',S.perfil); for(const id in S.entrenos) dbWrite('entrenos/'+id,S.entrenos[id]); for(const id in S.pesos) dbWrite('pesos/'+id,S.pesos[id]); }
      else { S=vacio(yo); pend={}; savePend(); lsSave(); }
      ui.loaded=true; render();
    } else {
      const o={perfil:null,entrenos:{},pesos:{}};
      rows.forEach(r=>{ if(r.col==='perfil') o.perfil=r.data; else if(o[r.col]) o[r.col][r.id]=r.data; });
      for(const k in pend){ const i=k.indexOf('/'),col=k.slice(0,i),id=k.slice(i+1); // lo que aún no ha subido manda
        if(col==='perfil'){ if(pend[k]) o.perfil=pend[k]; } else if(pend[k]==null) delete o[col][id]; else o[col][id]=pend[k]; }
      const nuevo={owner:yo,perfil:migrarPerfil(o.perfil),entrenos:o.entrenos,pesos:o.pesos};
      const primera=!ui.loaded; ui.loaded=true;
      if(JSON.stringify(nuevo)!==JSON.stringify(S)){ S=nuevo; lsSave(); render(); } else if(primera) render();
    }
    setSync(nPend()?'pend':'nube'); flush(); cargarGym(); programarRanking();
  }catch(e){ setSync('error'); if(!ui.loaded&&S.owner===session.user.id){ ui.loaded=true; render(); } }
  finally{ pulling=false; }
}

async function reducirFoto(file){

    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo leer la imagen'));i.src=url});
    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
  }finally{ URL.revokeObjectURL(url); }
}

function nutri(){
  const p=S.perfil, up=ultimoPeso(), w=(up&&up.kg)||+p.peso;
  if(!w||!+p.altura||!+p.edad) return null;
  const bmr=10*w+6.25*(+p.altura)-5*(+p.edad)+(p.sexo==='m'?-161:5);
  const tdee=bmr*(1.375+0.05*Math.min(5,(p.dias||[]).length));
  const f=faseActual();
  const aj={def:(+p.edad<18?-250:-450),vol:250,fuerza:200}[f.id]||0;
  const kcal=Math.round((tdee+aj)/50)*50, prot=Math.round(w*(f.id==='def'?2.2:2.0)/5)*5, grasa=Math.round(w*0.8/5)*5;
  return {kcal,prot,grasa,carb:Math.max(0,Math.round((kcal-prot*4-grasa*9)/4/5)*5),mant:Math.round(tdee/50)*50};
}

function entrenosOrden(){return Object.values(S.entrenos).sort((a,b)=>a.inicio-b.inicio)}
function terminados(){return entrenosOrden().filter(e=>e.fin)}
function activo(){return entrenosOrden().find(e=>!e.fin)||null}
function allSets(){
  const out=[];
  for(const e of entrenosOrden()) (e.ejercicios||[]).forEach((x,xi)=>(x.series||[]).forEach((s,si)=>out.push({ej:x.ej,peso:+s.peso||0,reps:+s.reps||0,t:s.t,eid:e.id,xi,si,rmin:x.rmin})));
  return out.sort((a,b)=>a.t-b.t);
}
function computeAll(){
  const sets=allSets(), best={}, prs=new Set(), bestSet={};
  for(const s of sets){ if(!EXM[s.ej]) continue; const v=e1rm(s.peso,s.reps); if(best[s.ej]!=null && v>best[s.ej]+0.01 && s.peso>0) prs.add(s.eid+'|'+s.xi+'|'+s.si); if(best[s.ej]==null||v>best[s.ej]){best[s.ej]=v;bestSet[s.ej]=s;} }
  return {sets,best,bestSet,prs};
}
function load(ej,m){const e=EXM[ej];if(!e)return 0;return e.p.includes(m)?1:e.s.includes(m)?0.5:0}
function recAt(m,sets,at){
  let c=0;const R=MUSC[m].r;
  for(const s of sets){const h=(at-s.t)/3.6e6; if(h<0||h>=R) continue; const l=load(s.ej,m); if(l) c+=l*(1-h/R);}
  return clamp(Math.round(100-c*13),0,100);
}
function recovery(sets){const now=Date.now(),o={};for(const m in MUSC)o[m]=recAt(m,sets,now);return o}
function horasListo(m,sets){const now=Date.now();for(let h=0;h<=96;h+=2){if(recAt(m,sets,now+h*3.6e6)>=85)return h}return 96}
function weekSets(sets){const from=Date.now()-7*864e5,o={};for(const m in MUSC)o[m]=0;for(const s of sets){if(s.t<from)continue;for(const m in MUSC)o[m]+=load(s.ej,m)}return o}
function musclesOf(tid){const o={};for(const x of P(tid).ej){const e=EXM[x.ej];e.p.forEach(m=>o[m]=Math.max(o[m]||0,1));e.s.forEach(m=>o[m]=Math.max(o[m]||0,.5))}return o}
function tplScore(tid,rec){const ms=musclesOf(tid);let a=0,w=0;for(const m in ms){a+=rec[m]*ms[m];w+=ms[m]}return Math.round(a/w)}
function recomendar(C){
  const rec=recovery(C.sets), fin=terminados(), dow=new Date().getDay();
  const yaHoy=fin.some(e=>dkey(new Date(e.inicio))===hoyK());
  const scores=DIAS_IDS.map(t=>({t,s:tplScore(t,rec)}));
  const hoy=SEMANA[dow]||null, va=(S.perfil.dias||[1,2,3,4,5]).includes(dow);
  const elegido=hoy||scores.slice().sort((a,b)=>b.s-a.s)[0].t, sc=tplScore(elegido,rec);
  let motivo=hoy?'Hoy es '+DIAS[dow]+': toca '+P(hoy).n.toLowerCase()+'.':'';
  if(hoy&&sc<55) motivo+=' Ojo: esos músculos están al '+sc+' % de recuperación, baja un poco el peso hoy.';
  const descanso=yaHoy?'hecho':!hoy?'finde':!va?'novas':null;
  return {elegido,motivo,rec,score:sc,scores,descanso};
}
function sugerencia(ej,obj,C){
  const e=EXM[ej]; if(!e) return null;
  const rmin=obj?.rmin??e.rmin, rmax=obj?.rmax??e.rmax;
  // última sesión con ese ejercicio (terminada o no, excluye la actual si está vacía)
  const ses=terminados().slice().reverse();
  for(const s of ses){const x=(s.ejercicios||[]).find(y=>y.ej===ej&&(y.series||[]).length);if(!x)continue;
    const top=Math.max(...x.series.map(z=>+z.peso||0));const work=x.series.filter(z=>(+z.peso||0)===top);
    const allTop=work.every(z=>(+z.reps||0)>=rmax);
    const ult=x.series.map(z=>fmtKg(+z.peso||0)+'×'+z.reps).join(' · ');
    if(allTop && e.inc>0) return {peso:top+e.inc,reps:rmin,txt:'Subiste todas a '+rmax+' reps: prueba con <b>'+fmtKg(top+e.inc)+' kg</b> a '+rmin+'+ reps.',ult,fecha:s.inicio};
    const minR=Math.min(...work.map(z=>+z.reps||0));
    return {peso:top,reps:Math.min(rmax,minR+1),txt:'Mantén <b>'+fmtKg(top)+' kg</b> e intenta sacar '+Math.min(rmax,minR+1)+' reps en cada serie.',ult,fecha:s.inicio};
  }
  return {peso:'',reps:rmax,txt:'Primera vez: elige un peso con el que llegues a '+rmax+' reps dejando 2 en reserva.',ult:null};
}
function xpInfo(C){
  const fin=terminados(); let xp=0;const det={series:0,prs:0,ses:0,peso:0,semanas:0};
  for(const s of C.sets){xp+=10;det.series++; if(s.rmin&&s.reps>=s.rmin)xp+=5;}
  xp+=C.prs.size*50;det.prs=C.prs.size;
  for(const e of fin){const n=(e.ejercicios||[]).reduce((a,x)=>a+(x.series||[]).length,0);if(n>=6){xp+=100;det.ses++}}
  for(const k in S.pesos){if(k>=APP_START){xp+=15;det.peso++}}
  const wk={};fin.forEach(e=>{const w=weekKey(e.inicio);wk[w]=(wk[w]||0)+1});
  const cur=weekKey(Date.now());
  for(const w in wk){if(wk[w]>=4){xp+=200;det.semanas++}}
  // racha de semanas con 4+
  let racha=0;const d=parseD(cur);
  if((wk[cur]||0)>=4)racha=1;
  for(let i=1;i<200;i++){const x=new Date(d);x.setDate(x.getDate()-7*i);if((wk[dkey(x)]||0)>=4)racha++;else break}
  let L=1;while(xpLevel(L+1)<=xp)L++;
  return {xp,L,det,wk,racha,cur:xp-xpLevel(L),need:xpLevel(L+1)-xpLevel(L),semana:wk[cur]||0};
}
function xpLevel(L){return Math.round(100*Math.pow(L-1,1.8))}

function rangoColor(L){return L>=40?'var(--chalk)':L>=30?'var(--red)':L>=20?'var(--blue)':L>=15?'var(--green)':L>=10?'var(--yellow)':L>=5?'var(--blue)':'var(--muted)'}
function pesosOrden(){return Object.values(S.pesos).filter(p=>p&&p.fecha).sort((a,b)=>a.fecha<b.fecha?-1:1)}
function mediaPeso(hasta,dias=7){const lim=dkey(new Date(parseD(hasta).getTime()-(dias-1)*864e5));const xs=pesosOrden().filter(p=>p.fecha<=hasta&&p.fecha>=lim);if(!xs.length)return null;return xs.reduce((a,p)=>a+p.kg,0)/xs.length}

function tendencia(){ // kg por semana en las últimas 3 semanas
  const p=pesosOrden().filter(x=>x.fecha>=dkey(new Date(Date.now()-21*864e5)));if(p.length<3)return null;

function chartPeso(){
  let pts=pesosOrden().map(p=>({t:parseD(p.fecha).getTime(),kg:p.kg,f:p.fecha}));
  const now=Date.now();let t0,t1;
  if(ui.rango==='plan'){t0=now-60*864e5;t1=now+180*864e5}
  else if(ui.rango==='ano'){t0=now-365*864e5;t1=now+7*864e5}
  else {t0=pts.length?pts[0].t:now-365*864e5;t1=now+14*864e5}
  pts=pts.filter(p=>p.t>=t0&&p.t<=t1);
  const plan=[];
  const OBJ=+S.perfil.pesoObjetivo||null, up0=ultimoPeso();
  if(ui.rango==='plan'&&OBJ&&up0&&up0.kg>OBJ){const ini=S.perfil.defIni&&S.perfil.defIni>hoyK()?parseD(S.perfil.defIni).getTime():now;const start=up0.kg;plan.push({t:now,kg:start});if(ini>now)plan.push({t:ini,kg:start});const wk=(start-OBJ)/0.6;plan.push({t:ini+wk*7*864e5,kg:OBJ});if(ini+wk*7*864e5<t1)plan.push({t:t1,kg:OBJ})}
  if(ui.rango==='plan'){const fin=plan.length?plan[plan.length-1].t:now+120*864e5;t1=Math.max(fin,now+60*864e5)}
  const all=pts.map(p=>p.kg).concat(plan.map(p=>p.kg),OBJ?[OBJ]:[]);
  if(!pts.length&&!plan.length)return '<div class="empty">Apunta tu peso para ver la gráfica.</div>';
  let lo=Math.floor(Math.min(...all)-2),hi=Math.ceil(Math.max(...all)+2);
  const W=640,H=230,L=40,Rm=14,Tm=12,B=26;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-Rm), y=v=>Tm+(hi-v)/(hi-lo)*(H-Tm-B);
  const step=Math.max(1,Math.ceil((hi-lo)/5));
  let g='';for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  // marcas de meses
  const d=new Date(t0);d.setDate(1);d.setMonth(d.getMonth()+1);const span=(t1-t0)/864e5;const every=span>900?6:span>400?3:1;let xl='';
  while(d.getTime()<=t1){if(d.getMonth()%every===0){const xx=x(d.getTime());xl+='<line x1="'+xx+'" x2="'+xx+'" y1="'+Tm+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="2 4"/><text x="'+xx+'" y="'+(H-8)+'" text-anchor="middle">'+MESES[d.getMonth()]+(d.getMonth()===0||every>1?' '+String(d.getFullYear()).slice(2):'')+'</text>'}d.setMonth(d.getMonth()+1)}
  const obj=OBJ?'<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y(OBJ)+'" y2="'+y(OBJ)+'" stroke="var(--red)" stroke-dasharray="6 5" stroke-width="1.5"/>':'';
  const pl=plan.length?'<polyline fill="none" stroke="var(--yellow)" stroke-width="2.5" stroke-dasharray="7 5" points="'+plan.map(p=>x(p.t)+','+y(p.kg)).join(' ')+'"/>':'';
  const area=pts.length>1?'<polygon fill="color-mix(in oklab,var(--accent) 14%,transparent)" points="'+x(pts[0].t)+','+(H-B)+' '+pts.map(p=>x(p.t)+','+y(p.kg)).join(' ')+' '+x(pts[pts.length-1].t)+','+(H-B)+'"/>':'';
  const line=pts.length>1?'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(p=>x(p.t)+','+y(p.kg)).join(' ')+'"/>':'';
  const dots=pts.map((p,i)=>{const last=i===pts.length-1;return '<circle cx="'+x(p.t)+'" cy="'+y(p.kg)+'" r="'+(last?5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"><title>'+fmtD(p.f)+': '+fmtKg(p.kg)+' kg</title></circle>'}).join('');
  const lp=pts[pts.length-1];const lab=lp?'<text x="'+Math.min(x(lp.t)+8,W-Rm-30)+'" y="'+(y(lp.kg)-9)+'" style="fill:var(--fg);font-weight:700">'+fmtKg(lp.kg)+'</text>':'';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfica de peso corporal">'+g+xl+area+obj+pl+line+dots+lab+'</svg></div>';
}
function chartSemanas(X){
  const W=640,H=170,L=30,Rm=10,Tm=10,B=24,N=10;const cur=parseD(weekKey(Date.now()));
  const wks=[];for(let i=N-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);wks.push({k:dkey(d),d,n:X.wk[dkey(d)]||0})}
  const mx=Math.max(6,...wks.map(w=>w.n));const bw=(W-L-Rm)/N;const y=v=>Tm+(mx-v)/mx*(H-Tm-B);
  let s='';for(let v=0;v<=mx;v+=2)s+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  wks.forEach((w,i)=>{const x=L+i*bw+bw*0.18,ww=bw*0.64;const c=w.n>=4?'var(--green)':w.n>0?'var(--accent)':'var(--line)';s+='<rect x="'+x+'" y="'+y(w.n)+'" width="'+ww+'" height="'+Math.max(0,(H-B)-y(w.n))+'" rx="3" fill="'+c+'"><title>Semana del '+fmtD(w.k)+': '+w.n+'</title></rect>';if(w.n)s+='<text x="'+(x+ww/2)+'" y="'+(y(w.n)-4)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+w.n+'</text>';s+='<text x="'+(x+ww/2)+'" y="'+(H-8)+'" text-anchor="middle">'+w.d.getDate()+' '+MESES[w.d.getMonth()]+'</text>'});
  s+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y(4)+'" y2="'+y(4)+'" stroke="var(--fg)" stroke-dasharray="5 5" opacity=".5"/>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Entrenos por semana">'+s+'</svg></div>';
}

let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1175:880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+d;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.start(t);o.stop(t+0.22)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
function startTimer(sec,label){timer={end:Date.now()+sec*1000,total:sec,label,beeped:false};renderTimer()}
function renderTimer(){
  const el=$('#timer');if(!timer){el.hidden=true;el.className='';return}
  const left=Math.ceil((timer.end-Date.now())/1000);const over=left<=0;
  if(over&&!timer.beeped){timer.beeped=true;beep()}
  if(left<-90){timer=null;el.hidden=true;return}
  const m=Math.floor(Math.abs(left)/60),s=Math.abs(left)%60;const pct=clamp((1-left/timer.total)*100,0,100);
  el.hidden=false;el.className='timer'+(over?' over':'');
  el.innerHTML='<div class="in" role="timer" aria-live="off"><span class="t">'+(over?'+':'')+m+':'+pad(s)+'</span><div class="lab"><b>'+(over?'¡Siguiente serie!':'Descanso')+'</b> · '+esc(timer.label)+'<div class="bar"><i style="width:'+pct+'%"></i></div></div><button data-act="tAdd" data-s="-15" aria-label="Quitar 15 segundos">−15</button><button data-act="tAdd" data-s="15" aria-label="Añadir 15 segundos">+15</button><button data-act="tStop">'+(over?'OK':'Saltar')+'</button></div>';
}
setInterval(()=>{if(timer)renderTimer();const e=document.querySelector('[data-elapsed]');const a=activo();if(e&&a)e.textContent=Math.floor((Date.now()-a.inicio)/60000)+' min'},500);
let wl=null;async function wake(){try{if(activo()&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}else if(!activo()&&wl){wl.release();wl=null}}catch(e){}}

  if(a==='addEj'&&A){const e=EXM[el.dataset.e];const x=JSON.parse(JSON.stringify(A));x.ejercicios.push({ej:e.id,series_obj:3,rmin:e.rmin,rmax:e.rmax,series:[]});ui.picker=false;ui.pickQ='';saveEntreno(x);toast(e.n+' añadido');if(ui.view!=='entreno')go('entreno');else render();return}

  if(a==='masSerie'&&A){const x=JSON.parse(JSON.stringify(A));x.ejercicios[+el.dataset.x].series_obj++;saveEntreno(x);return render()}
  if(a==='delSet'&&A){const x=JSON.parse(JSON.stringify(A));x.ejercicios[+el.dataset.x].series.splice(+el.dataset.s,1);saveEntreno(x);return render()}
  if(a==='terminar'&&A){
    const before=xpInfo(computeAll()).xp;
    const x=JSON.parse(JSON.stringify(A));x.fin=Date.now();

    ui.confirm=null;timer=null;ui.draft={};return go('hoy');
  }
  if(a==='descartar'&&A){delEntreno(A.id);ui.confirm=null;timer=null;ui.draft={};toast('Entreno descartado');return go('hoy')}
  if(a==='delEntreno'){delEntreno(el.dataset.id);ui.confirm=null;toast('Entreno borrado');return render()}
  if(a==='delPeso'){delPeso(el.dataset.f);ui.confirm=null;return render()}

  if(a==='tSet'){ui.td[el.dataset.f]=el.dataset.v;return render()}
  if(a==='tTog'){const f=el.dataset.f,v=f==='dias'?+el.dataset.v:el.dataset.v;const arr=(ui.td[f]||[]).slice();const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);if(f==='dias')arr.sort();ui.td[f]=arr;return render()}
  if(a==='tPaso'){const to=+el.dataset.v;if(to>(ui.ts||1)){const err=validarPaso(ui.ts||1);if(err)return toast(err)}ui.ts=to;render();window.scrollTo(0,0);return}
  if(a==='tCancel'){ui.forceTest=false;ui.td=null;ui.ts=1;return render()}
  if(a==='tFin'){const t=ui.td;for(let k=1;k<=4;k++){const err=validarPaso(k);if(err){ui.ts=k;render();return toast(err)}}
    const fotos=S.perfil.fotos||[];S.perfil=Object.assign(S.perfil,t,{nombre:String(t.nombre).trim().slice(0,30),edad:+t.edad,altura:+t.altura,peso:+t.peso,pesoObjetivo:+t.pesoObjetivo||'',fotos,onboarded:true,testFecha:hoyK()});
    if(!S.pesos[hoyK()])savePeso(hoyK(),Math.round(+t.peso*10)/10);
    savePerfil();ui.td=null;ui.ts=1;ui.forceTest=false;toast('¡Plan listo!');return go('hoy')}
  if(a==='repetirTest'){ui.forceTest=true;ui.td=null;ui.ts=1;render();window.scrollTo(0,0);return}
  if(a==='rkCat'){ui.rkCat=el.dataset.v;return render()}
  if(a==='rkLift'){ui.rkLift=el.dataset.v;return render()}
  if(a==='rkRefresh'){programarRanking();cargarRanking();return render()}
  if(a==='delFoto')return borrarFoto(el.dataset.p);
  if(a==='delRew'){S.perfil.recompensas=(S.perfil.recompensas||[]).filter(r=>r.id!==el.dataset.id);savePerfil();return render()}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;if(el.tagName==='BUTTON'||el.tagName==='polygon')ev.preventDefault();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}act(el)});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('polygon[data-act]')){ev.preventDefault();act(ev.target)}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.d){const xi=t.dataset.x;ui.draft[xi]=ui.draft[xi]||{};ui.draft[xi][t.dataset.d]=t.value;return}
  if(t.hasAttribute('data-pick')){ui.pickQ=t.value;const p=t.closest('.card');if(p){const box=p.querySelector('.picker');const tmp=document.createElement('div');tmp.innerHTML=picker();box.replaceWith(tmp.querySelector('.picker'))}return}
  if(t.hasAttribute('data-q')){ui.q=t.value;clearTimeout(ui._q);ui._q=setTimeout(render,150);return}
  if(t.dataset.rew){ui.newRew[t.dataset.rew]=t.value}
  if(t.dataset.tf&&ui.td){ui.td[t.dataset.tf]=t.value}
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.rew)ui.newRew[t.dataset.rew]=t.value;
  if(t.dataset.tf&&ui.td)ui.td[t.dataset.tf]=t.value;
  if(t.dataset.foto&&t.files&&t.files[0]){subirFoto(t.files[0],t.dataset.foto);t.value=''}
  if(t.dataset.gym){GYM.eq[t.dataset.gym]=t.checked;guardarGym()}
  if(t.hasAttribute('data-nej')){GYM.nEj=+t.value;guardarGym()}
  if(t.dataset.swap){const [d,i]=t.dataset.swap.split('|');GYM.cambios=GYM.cambios||{};GYM.cambios[d]=Object.assign({},GYM.cambios[d],{[i]:t.value});guardarGym();toast('Cambiado para todo el grupo')}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,k=f.dataset.form;
  if(k==='login'){entrar('entrar');return}
  if(k==='set'){const A=activo();if(!A)return;const xi=+f.dataset.x;const p=parseFloat(String(f.querySelector('[data-d=peso]').value).replace(',','.')),r=parseInt(f.querySelector('[data-d=reps]').value,10);
    if(!(p>=0)||!(r>0)){toast('Pon el peso (0 si es con tu cuerpo) y las repeticiones.');return}
    const x=JSON.parse(JSON.stringify(A));const ej=x.ejercicios[xi];ej.series.push({peso:p,reps:r,t:Date.now()});
    ui.draft[xi]={peso:p,reps:r};saveEntreno(x);
    const e=EXM[ej.ej];const C=computeAll();const pr=C.prs.has(x.id+'|'+xi+'|'+(ej.series.length-1));
    const quedan=ej.series_obj-ej.series.length;
    startTimer(e.d,e.n+(quedan>0?' · quedan '+quedan:' · ejercicio completo'));
    if(pr)toast('¡Récord personal en '+e.n+'! +50 XP');
    render();return}
  if(k==='peso'){const v=parseFloat(String($('#pesoHoy').value).replace(',','.'));if(!(v>=40&&v<=200)){toast('Escribe un peso entre 40 y 200 kg.');return}savePeso(hoyK(),Math.round(v*10)/10);toast('Peso guardado');render();return}
  if(k==='pesoFecha'){const fe=$('#pf').value,v=parseFloat(String($('#pk').value).replace(',','.'));if(!fe||!(v>=40&&v<=200)){toast('Pon una fecha y un peso entre 40 y 200 kg.');return}savePeso(fe,Math.round(v*10)/10);toast('Peso añadido');render();return}
  if(k==='objetivo'){const v=parseFloat($('#obj').value);if(!(v>=50&&v<=150))return toast('Objetivo entre 50 y 150 kg.');S.perfil.pesoObjetivo=v;savePerfil();toast('Objetivo guardado');render();return}
  if(k==='rew'){const r=ui.newRew;const v=parseFloat(r.v);if(!r.txt.trim()||!(v>0)){toast('Escribe la recompensa y un valor.');return}S.perfil.recompensas=(S.perfil.recompensas||[]).concat([{id:uid(),txt:r.txt.trim().slice(0,80),tipo:r.tipo,v}]);ui.newRew={txt:'',tipo:'nivel',v:''};savePerfil();toast('Recompensa añadida');render();return}
});
window.addEventListener('hashchange',()=>{const v=vistaDeHash();if(v&&v!==ui.view){ui.view=v;render()}});

/* ===================== ARRANQUE ===================== */
(function(){const v=vistaDeHash();if(v)ui.view=v;else if(activo())ui.view='entreno';render();init();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||EN_PC)){navigator.serviceWorker.register('sw.js').catch(()=>{})}})();
</script>
